# Làm mới dữ liệu "live" Utility Hub — chạy mỗi 30 phút (crypto, giá vàng, tỉ giá, Fear & Greed).
name: refresh-live

on:
  schedule:
    - cron: '*/30 * * * *'  # mỗi 30 phút
  workflow_dispatch:       # cho phép chạy tay từ tab Actions

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tải dữ liệu live (crypto, giá vàng, tỉ giá, Fear & Greed)
        run: node scripts/fetch-data.mjs --only live

      - name: Commit + push nếu có thay đổi
        run: |
          git config user.name "utility-hub-bot"
          git config user.email "utility-hub-bot@users.noreply.github.com"
          git add src/data/crypto.json src/data/gold.json src/data/fx.json src/data/fng.json
          if git diff --cached --quiet; then
            echo "Không có thay đổi dữ liệu live."
          else
            git commit -m "data(live): làm mới crypto/vàng/tỉ giá/FNG $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # Rebase trước khi push: tránh xung đột khi workflow daily push cùng lúc (00:30, 11:30 UTC).
            git pull --rebase || true
            git push
          fi
